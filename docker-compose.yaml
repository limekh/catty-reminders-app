services:
  app:
    image: ghcr.io/limekh/catty-reminders-app:latest
    container_name: catty-app
    restart: always

    ports:
      - "8181:8181"

    environment:
      MYSQL_HOST: db
      MYSQL_USER: catty
      MYSQL_PASSWORD: cattypass
      MYSQL_DATABASE: catty
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: catty-db
    restart: always

    environment:
      MYSQL_DATABASE: catty
      MYSQL_USER: catty
      MYSQL_PASSWORD: cattypass
      MYSQL_ROOT_PASSWORD: rootpass

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
