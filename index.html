<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Lab #1 - Milyokhin</title>
    <style>
        body {
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #1a1a2e;
            color: #eee;
        }
        .container { text-align: center; }
        .rocket { font-size: 4rem; animation: launch 2s infinite; }
        @keyframes launch {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .version { color: #00d9ff; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="rocket">🚀</div>
        <h1>DevOps Lab #1</h1>
        <p>GitHub Webhooks + Auto-deploy</p>
        <p class="version">Version: 1.0.0</p>
        <p>ID: milyokhin</p>
    </div>
</body>
</html>
